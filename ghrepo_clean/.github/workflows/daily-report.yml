name: Daily Transport Service Report

# Manual-only trigger for now (button in the Actions tab: "Run workflow").
# No cron schedule -- intentional, per initial rollout decision: keep this
# manual while the CSV-based parser is still new/unproven, add a schedule:
# block later once it's been reliable for a while.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Node dependencies (Puppeteer + Chrome)
        run: npm install

      - name: Install headless Chrome system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk-bridge2.0-0 libxss1 libasound2t64 libgbm1 \
            libxshmfence1 libx11-xcb1 libxcomposite1 libxdamage1 libxrandr2 \
            fonts-liberation libappindicator3-1 || true

      - name: Build report HTML from Google Sheets CSV
        env:
          CSV_URL_DM: ${{ secrets.CSV_URL_DM }}
          CSV_URL_VM: ${{ secrets.CSV_URL_VM }}
        run: python scripts/build_report.py Daily_Transport_Service_Report.html

      - name: Render PDF (portrait + landscape)
        run: node scripts/render_pdf.js Daily_Transport_Service_Report.html .

      - name: Merge PDF
        run: python scripts/merge_pdf.py page1_portrait.pdf page2_landscape.pdf Daily_Transport_Service_Report.pdf

      - name: Clean up intermediate PDFs
        run: rm -f page1_portrait.pdf page2_landscape.pdf

      # Also upload as a workflow artifact -- gives you a download link on
      # the run summary page even if the commit step below is ever skipped
      # (e.g. no changes to commit) or you just don't want to dig through
      # git history.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-transport-report
          path: |
            Daily_Transport_Service_Report.html
            Daily_Transport_Service_Report.pdf
          retention-days: 30

      - name: Commit report back to repo
        run: |
          git config user.name "daily-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add Daily_Transport_Service_Report.html Daily_Transport_Service_Report.pdf
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update daily transport service report ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
